<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183c30"><meta name="description" content="Control sencillo de gastos e ingresos personales"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Mi Dinero</title></head>
<body><div class="app"><header><div><small>MI DINERO</small><h1>Resumen</h1></div><button class="iconbtn" id="settingsBtn" aria-label="Ajustes">⚙</button></header>
<section class="hero"><small>Disponible este mes</small><h2 id="balance">0,00 €</h2><div class="totals"><div><small>Ingresos</small><strong id="income">0,00 €</strong></div><div><small>Gastos</small><strong id="spent">0,00 €</strong></div></div><div class="progress"><span id="progress"></span></div><small id="budgetText">Presupuesto mensual</small></section>
<div class="monthrow"><button id="prevMonth">‹</button><strong id="monthLabel"></strong><button id="nextMonth">›</button></div>
<div class="quick"><button id="addExpense" class="primary">＋ Añadir gasto</button><button id="addIncome" class="secondary">＋ Ingreso</button></div>
<section class="section"><div class="sectionhead"><h3>Gastos por categoría</h3></div><div id="categories" class="categories"><p class="muted">Sin gastos este mes</p></div></section>
<section class="section"><div class="sectionhead"><h3>Movimientos</h3><button id="filterBtn">Filtrar</button></div><div id="transactions"></div></section>
<nav><button class="active" data-tab="home">⌂<span>Inicio</span></button><button data-tab="stats">▤<span>Estadísticas</span></button><button data-tab="history">◷<span>Historial</span></button><button data-tab="settings">⚙<span>Ajustes</span></button></nav></div>
<div id="modal" class="modal hidden"><div class="sheet"><button id="closeModal" class="close">×</button><h2 id="modalTitle">Añadir movimiento</h2><form id="transactionForm"><input type="hidden" id="editId"><label>Importe (€)<input id="amount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="0,00" required></label><label>Descripción<input id="description" maxlength="60" placeholder="Ej. Supermercado" required></label><label>Categoría<select id="category"></select></label><label>Fecha<input id="date" type="date" required></label><div class="actions"><button type="button" id="cancel" class="secondary">Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></div></div>
<div id="settingsModal" class="modal hidden"><div class="sheet"><button class="close" id="closeSettings">×</button><h2>Ajustes</h2><label>Presupuesto mensual (€)<input id="budgetInput" type="number" min="0" step="0.01"></label><div class="actions"><button id="saveBudget" class="primary">Guardar presupuesto</button></div><hr><button id="exportBtn" class="secondary wide">Exportar copia de seguridad</button><label class="wide">Restaurar copia<input id="importInput" type="file" accept="application/json"></label><p class="muted">Los datos se guardan en este dispositivo. Exporta copias regularmente.</p></div></div>
<div id="filterModal" class="modal hidden"><div class="sheet"><button class="close" id="closeFilter">×</button><h2>Filtrar movimientos</h2><label>Tipo<select id="filterType"><option value="all">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option></select></label><label>Categoría<select id="filterCategory"><option value="all">Todas</option></select></label><div class="actions"><button id="clearFilter" class="secondary">Limpiar</button><button id="applyFilter" class="primary">Aplicar</button></div></div></div>
<div id="statsModal" class="modal hidden"><div class="sheet"><button class="close" id="closeStats">×</button><h2>Estadísticas</h2><div id="statsContent"></div></div></div>
<script src="app.js"></script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
